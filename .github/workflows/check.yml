name: Pine core checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.400
      - run: dotnet run --project Tests~/Core/Pine.Tests.csproj
      - run: dotnet tool restore
      - run: dotnet csharpier check . --include-generated
      - run: dotnet run --project Tests~/Generator/Pine.Generator.Tests.csproj
      - run: python3 Tools~/check_generator.py
